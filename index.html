function App(){
 const [S,setS]=useState(load),[tab,setTab]=useState('home'),[act,setAct]=useState(null),[say,setSay]=useState(''),[toast,setToast]=useState(''),[cele,setCele]=useState(false);
 const [msgs,setMsgs]=useState([]),[inp,setInp]=useState(''),[typing,setTyping]=useState(false);
 const sr=useRef(S),petAt=useRef(0),chatAt=useRef(0);sr.current=S;
 const up=useCallback(f=>setS(p=>{const n=JSON.parse(JSON.stringify(p));f(n);n.bond=Math.max(p.bond,n.bond);n.hunger=cl(n.hunger);n.joy=cl(n.joy);n.energy=cl(n.energy);
  const l=lvOf(n.bond);if(l>n.lvSeen){n.lvSeen=l;setTimeout(()=>{setCele(true);setToast(`친밀도 ${l}단계! ${LVN[l-1]} 🎉`);setTimeout(()=>setCele(false),3200)},0)}
  return n}),[]);
 useEffect(()=>{if(S){try{localStorage.setItem(KEY,JSON.stringify({...S,last:Date.now()}))}catch(e){}}},[S]);
 useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),2600);return()=>clearTimeout(t)},[toast]);
 useEffect(()=>{if(!S)return;const t=setInterval(()=>up(n=>{n.hunger-=1.2;n.joy-=.6;n.energy-=.3}),30000);return()=>clearInterval(t)},[!!S]);
 useEffect(()=>{if(!S)return;const t=setInterval(()=>{if(Math.random()<.3){const e=['창밖에서 나비가 손을 흔들었어요 🦋','반짝이는 단추를 주웠어요 ✨','몰래 춤을 췄어요 🎶'];setToast(e[Math.floor(Math.random()*3)]+' (+3 코인)');up(n=>{n.coins+=3})}},45000);return()=>clearInterval(t)},[!!S]);
 useEffect(()=>{if(S)setSay(SAY[moodOf(S)][0])},[!!S]);
 useEffect(()=>{const b=document.getElementById('bg');b.innerHTML=Array.from({length:22},(_,i)=>`<i style="left:${(i*47)%100}%;top:${(i*29+7)%100}%;font-size:${12+i%4*6}px;animation-delay:${i%5}s">${['✦','♡','☁️','✧'][i%4]}</i>`).join('')},[]);

 if(!S)return html`<${Adopt} onPick=${(sp,n)=>setS(fresh(sp,n))}/>`;
 const lv=lvOf(S.bond),mood=act||moodOf(S),worn={};WEAR.forEach(w=>{if(S.worn[w[0]])worn[w[0]]=1});
 const flash=(a,t,ms=1800)=>{setAct(a);setSay(t);setTimeout(()=>setAct(null),ms)};
 const pick=a=>a[Math.floor(Math.random()*a.length)];
 const feed=()=>{if(S.hunger>92)return setSay('배가 빵빵해서 더는 못 먹겠어요 🍙');up(n=>{if(n.hunger<70)bondUp(n,'feed',2,6);n.hunger+=30;n.joy+=4;n.st.feed++;n.today.feed++});flash('eat',pick(['냠냠냠! 너무 맛있어 😋','쩝쩝… 볼이 빵빵해졌어!']),2200)};
 const pet=()=>{const now=Date.now();if(now-petAt.current<5000)return flash('happy',pick(['지금도 충분히 행복해! 조금 있다가 또 해줘 😊','포근포근~ 마음이 가득 찼어 ☁️']),1200);petAt.current=now;up(n=>{if(n.joy<95)n.joy+=6;bondUp(n,'pet',1,10);n.st.pet++;n.today.pet++});flash('love',pick(['헤헤 간질간질~ 💗','더 쓰다듬어 줘~ ✨','기분이 몽글몽글해!']),1400)};
 const play=()=>{if(S.energy<15)return flash('sleepy','후아암… 조금 쉬었다 놀자 😪');up(n=>{n.joy+=16;n.energy-=12;n.hunger-=8;bondUp(n,'play',3,12);n.coins+=2;n.st.play++;n.today.play++});flash('happy','와아~ 신난다! 🎈',2400)};
 const sleep=()=>{if(S.energy>80)return setSay('아직 안 졸려요! 조금 더 놀다가 자자 🌙');flash('sleepy','쿨쿨… 💤',3200);up(n=>{n.energy+=40})};
 const send=t=>{t=t.trim();if(!t||typing)return;setInp('');setMsgs(m=>[...m,{me:1,t}]);setTyping(true);const ok=Date.now()-chatAt.current>3000;chatAt.current=Date.now();
  up(n=>{if(ok){bondUp(n,'chat',1,12);n.joy+=2}n.st.chat++;n.today.chat++});
  setTimeout(()=>{const c=sr.current,r=Brain.reply(c.sp,t,{lv:lvOf(c.bond),name:c.name,hunger:c.hunger,energy:c.energy,mem:c.mem,w:['맑은','비 오는','눈 오는','흐린'][c.weather]});
   setTyping(false);setMsgs(m=>[...m,{t:r.t}]);setSay(r.t.slice(0,40));up(n=>{if(r.topic)n.mem={topic:r.topic,asked:false};if(r.asked)n.mem.asked=true});
   if(['comfort','love','hug','praise','miss'].includes(r.intent)){setAct('love');setTimeout(()=>setAct(null),1800)}},600+Math.random()*700)};
 const buy=(list,id,cost)=>up(n=>{if(!n.own.includes(id)){if(n.coins<cost){setToast('코인이 조금 모자라요 🪙');return}n.coins-=cost;n.own.push(id);setToast('새 아이템을 얻었어요 🎁')}return n});
 const wear=id=>up(n=>{n.worn[id]=!n.worn[id]});
 const place=id=>up(n=>{n.placed=n.placed.includes(id)?n.placed.filter(x=>x!==id):[...n.placed,id]});
 const cp=S.cap&&S.cap.d===day()?S.cap:{pet:0,chat:0,feed:0,play:0,game:0},tot=cp.pet+cp.chat+cp.feed+cp.play+cp.game;
 const night=new Date().getHours()<6||new Date().getHours()>=19,W=['☀️','🌧️','❄️','☁️'][S.weather];
 const days=Math.floor((Date.now()-S.born)/864e5)+1;
 const winBg=night?'linear-gradient(#2b2a5e,#5a4a9e)':S.weather===1||S.weather===3?'linear-gradient(#b8c6dd,#dfe6f0)':'linear-gradient(#a8dcff,#e8f6ff)';
 const nxt=LV[lv]||null,bp=nxt?(S.bond-LV[lv-1])/(nxt-LV[lv-1])*100:100;
 const room=html`<div className="room" style=${{background:S.wall===-1?'#fff':WALLS[S.wall]}}>
  <div className="win" style=${{background:winBg}} onClick=${()=>up(n=>{n.weather=(n.weather+1)%4})} title="창문을 눌러 날씨 바꾸기" role="button" aria-label="창밖 날씨 바꾸기">
   <span style=${{position:'absolute',left:8,top:6,fontSize:night?20:30}}>${night?'🌙':W}</span>
   ${S.weather===1&&Array.from({length:6},(_,i)=>html`<b key=${i} style=${{left:10+i*16,animationDelay:i*.3+'s'}}>💧</b>`)}
   ${S.weather===2&&Array.from({length:6},(_,i)=>html`<b key=${i} style=${{left:10+i*16,animationDelay:i*.3+'s'}}>❄️</b>`)}
  </div>
  <div className="floor" style=${{background:FLOORS[S.floor]}}/>
  ${FURN.filter(f=>S.placed.includes(f[0])).map(f=>html`<div key=${f[0]} className="furn" style=${Object.fromEntries(f[5].split(';').map(x=>x.split(':')))}>${f[2]}</div>`)}
  <div className="speech"><span key=${say}>${say}</span></div>
  <div className=${'pet a-'+(mood==='love'?'happy':mood)} onClick=${pet} role="button" tabIndex="0" aria-label="쓰다듬기" onKeyDown=${e=>e.key==='Enter'&&pet()}><${Pet} sp=${S.sp} mood=${mood} worn=${worn}/></div>
  ${night&&html`<div style=${{position:'absolute',inset:0,background:'rgba(40,30,90,.28)',pointerEvents:'none',zIndex:4}}/>`}
 </div>`;
 const Bar=(l,v,c)=>html`<div className="bar">${l} ${Math.round(v)}<div><i style=${{width:v+'%',background:c}}/></div></div>`;
 return html`<div>
  ${toast&&html`<div className="toast" key=${toast}>${toast}</div>`}
  ${cele&&html`<div className="cele">${Array.from({length:30},(_,i)=>html`<i key=${i} style=${{left:(i*37)%100+'%',animationDelay:(i%8)*.2+'s'}}>${['💗','✨','⭐','💖'][i%4]}</i>`)}</div>`}
  <div className="top"><h1>🌷 ${S.name}와 ${days}일째</h1><div className="pill">🪙 ${S.coins}</div></div>
  <div id="nav" role="tablist">${[['home','🏠 돌보기'],['chat','💬 대화'],['style','🎀 꾸미기'],['fun','🎁 놀이']].map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${tab===k} onClick=${()=>setTab(k)}>${l}</button>`)}</div>
  <div className="main">
   <div>${room}
    <div className="card" style=${{marginTop:12}}>
     <div style=${{display:'flex',justifyContent:'space-between'}}><span>💞 ${LVN[lv-1]} (Lv.${lv})</span><span>${TITLES[lv-1]}</span></div>
     <div className="bar"><div><i style=${{width:bp+'%',background:'linear-gradient(90deg,#ff9ec4,#b9a3ff)'}}/></div></div>
     <div className="bars">${Bar('🍙 배고픔(배부름)',S.hunger,'#ffb27a')}${Bar('💗 행복도',S.joy,'#ff8fb8')}${Bar('⚡ 에너지',S.energy,'#7fd6b0')}${Bar('🫶 친밀도',Math.min(100,bp),'#b9a3ff')}</div><p style=${{fontSize:12,opacity:.7,margin:'10px 0 0'}}>오늘 쌓은 마음 ${tot}/44 · 하루에 조금씩, 천천히 가까워져요 🌷</p>
    </div>
   </div>
   <div className="card">
    ${tab==='home'&&html`<h2>${S.name}에게 해주기</h2><div className="row">
      <button className="btn p" onClick=${feed}>🍙 먹이주기</button><button className="btn p" onClick=${pet}>🫶 쓰다듬기</button>
      <button className="btn p" onClick=${play}>🎈 놀아주기</button><button className="btn" onClick=${sleep}>🌙 재우기</button></div>
      <p style=${{fontSize:14,opacity:.8,lineHeight:1.6}}>${SP[S.sp].n} · ${SP[S.sp].p}.<br/>오랜만에 와도 괜찮아요. ${S.name}는 언제나 느긋하게 기다려요 🌷</p>`}
    ${tab==='chat'&&html`<div style=${{display:'flex',gap:10,alignItems:'center'}}><div style=${{width:54}}><${Pet} sp=${S.sp} mood=${mood==='eat'?'happy':mood} worn=${{}}/></div><div><b style=${{fontWeight:400}}>${S.name}</b><div style=${{fontSize:12,opacity:.7}}>기본 대화 모드 · 외부 AI 미연결(성격별 규칙 대화)</div></div></div>
     <${Chat} msgs=${msgs} first=${Brain.greet(S.sp,lv)} typing=${typing}/>
     <div className="row" style=${{marginTop:8}}>${['안아 줘','놀자!','오늘 있었던 일','사랑해 💗','같이 쉬자'].map(q=>html`<button key=${q} className="btn" style=${{flex:'0 0 auto',padding:'8px 12px',fontSize:13}} disabled=${typing} onClick=${()=>send(q)}>${q}</button>`)}</div>
     <form className="row" onSubmit=${e=>{e.preventDefault();send(inp)}}><input value=${inp} onChange=${e=>setInp(e.target.value)} placeholder="말을 걸어보세요" aria-label="메시지"/><button className="btn p" style=${{flex:'0 0 auto'}} type="submit">보내기</button></form><p style=${{fontSize:12,opacity:.7,margin:'8px 0 0'}}>오늘 대화로 쌓은 마음 ${cp.chat}/12 · 더 얘기해도 괜찮아요, 천천히 쌓여요</p>`}
    ${tab==='style'&&html`<h2>옷과 액세서리</h2><div className="grid">${WEAR.map(([id,n,ic,cost,need])=>{const o=S.own.includes(id),lk=lv<need;return html`<button key=${id} className=${'it '+(S.worn[id]?'on':'')+(lk?' lk':'')} disabled=${lk} onClick=${()=>o?wear(id):buy(WEAR,id,cost)}><span>${ic}</span>${n}<br/>${lk?'🔒 Lv.'+need:o?(S.worn[id]?'착용 중':'착용하기'):'🪙'+cost}</button>`})}</div>
     <h2>가구와 소품</h2><div className="grid">${FURN.map(([id,n,ic,cost,need])=>{const o=S.own.includes(id),lk=lv<need;return html`<button key=${id} className=${'it '+(S.placed.includes(id)?'on':'')+(lk?' lk':'')} disabled=${lk} onClick=${()=>o?place(id):buy(FURN,id,cost)}><span>${ic}</span>${n}<br/>${lk?'🔒 Lv.'+need:o?(S.placed.includes(id)?'놓는 중':'놓기'):'🪙'+cost}</button>`})}</div>
     <h2>벽지</h2><div className="row">${WALLS.map((c,i)=>html`<button key=${c} className=${'dot '+(S.wall===i?'on':'')} style=${{background:c}} aria-label=${'벽지 '+(i+1)} onClick=${()=>up(n=>{n.wall=i})}/>`)}</div>
     <h2>바닥</h2><div className="row">${FLOORS.map((c,i)=>html`<button key=${c} className=${'dot '+(S.floor===i?'on':'')} style=${{background:c}} aria-label=${'바닥 '+(i+1)} onClick=${()=>up(n=>{n.floor=i})}/>`)}</div>`}
    ${tab==='fun'&&html`<${Fun} S=${S} up=${up} setToast=${setToast} lv=${lv}/>`}
   </div>
  </div></div>`;}

function Chat({msgs,first,typing}){const r=useRef();useEffect(()=>{r.current.scrollTop=1e5},[msgs,typing]);
 return html`<div className="chat" ref=${r}><div className="m pt">${first}</div>${msgs.map((m,i)=>html`<div key=${i} className=${'m '+(m.me?'me':'pt')}>${m.t}</div>`)}${typing&&html`<div className="m pt ty">…</div>`}</div>`}

function Fun({S,up,setToast}){
 const [g,setG]=useState(null),[stars,setStars]=useState([]),sc=useRef(0);
 const can=S.gift!==day(),left=3-(S.cap&&S.cap.d===day()?(S.cap.gp||0):0);
 const open=()=>{const c=5+Math.floor(Math.random()*8);up(n=>{n.gift=day();n.coins+=c;n.joy+=10});setToast(`선물 상자에서 코인 ${c}개가 나왔어요 🎁`)};
 useEffect(()=>{if(!g)return;let id=0,t=g.t;const sp=setInterval(()=>setStars(s=>[...s.filter(x=>Date.now()-x.at<1600),{id:id++,at:Date.now(),x:Math.random()*80+4,y:Math.random()*70+4}]),550);
  const tk=setInterval(()=>{t--;setG(p=>p&&{...p,t});if(t<=0){clearInterval(sp);clearInterval(tk);setG(null);setStars([]);const c=sc.current;up(n=>{n.coins+=c;n.joy+=8;bondUp(n,'game',2,4);n.st.game++});setToast(`별 ${c}개를 모았어요! +${c} 코인 ⭐`)}},1000);
  return()=>{clearInterval(sp);clearInterval(tk)}},[!!g]);
 return html`<h2>오늘의 선물 상자</h2>
  <button className="btn p" style=${{width:'100%'}} disabled=${!can} onClick=${open}>${can?'🎁 선물 열기':'오늘 선물은 받았어요 (내일 또 만나요)'}</button>
  <h2>별 잡기 미니게임</h2>
  ${g?html`<div>남은 시간 ${g.t}초 · 모은 별 ${g.s}</div>`:html`<button className="btn" style=${{width:'100%'}} disabled=${left<=0} onClick=${()=>{up(n=>{if(!n.cap||n.cap.d!==day())n.cap={d:day(),pet:0,chat:0,feed:0,play:0,game:0};n.cap.gp=(n.cap.gp||0)+1});sc.current=0;setG({t:10,s:0})}}>${left>0?'⭐ 10초 동안 별 잡기 (오늘 '+left+'회 남음)':'⭐ 오늘 별 잡기는 끝! 내일 또 만나요'}</button>`}
  ${g&&html`<div className="gm">${stars.map(s=>html`<button key=${s.id} style=${{left:s.x+'%',top:s.y+'%'}} aria-label="별" onClick=${()=>{sc.current++;setG(p=>({...p,s:p.s+1}));setStars(a=>a.filter(x=>x.id!==s.id))}}>⭐</button>`)}</div>`}
  <h2>오늘의 일기</h2><div className="m pt" style=${{maxWidth:'100%'}}>📖 ${diaryText(S)}</div>
  ${S.diary.slice(0,3).map((d,i)=>html`<div key=${i} style=${{fontSize:12,opacity:.7,marginTop:6}}>${d.d} · ${d.t}</div>`)}
  <h2>업적 배지</h2>${BADGES.map(([n,ic,f])=>html`<span key=${n} className=${'bd '+(f(S)?'':'off')}>${ic} ${n}</span>`)}`}

function Adopt({onPick}){
 const [sp,setSp]=useState('chick'),[name,setName]=useState('');
 return html`<div style=${{textAlign:'center'}}><h1 style=${{fontWeight:400,fontSize:28,margin:'24px 0 4px'}}>몽글몽글 반려 친구 🌷</h1>
 <p>함께할 친구를 골라 입양해 주세요</p>
 <div className="adopt">${Object.entries(SP).map(([k,v])=>html`<button key=${k} className="ad" style=${{outline:sp===k?'4px solid #b9a3ff':'none'}} onClick=${()=>setSp(k)}><${Pet} sp=${k} mood=${sp===k?'happy':'idle'} worn=${{}}/><b style=${{fontWeight:400,fontSize:18}}>${v.n}</b><small>${v.p}</small></button>`)}</div>
 <div className="card" style=${{maxWidth:420,margin:'18px auto'}}><form className="row" style=${{marginTop:0}} onSubmit=${e=>{e.preventDefault();onPick(sp,name.trim()||SP[sp].n)}}>
  <input value=${name} maxLength="8" onChange=${e=>setName(e.target.value)} placeholder="이름을 지어주세요" aria-label="이름"/><button className="btn p" style=${{flex:'0 0 auto'}} type="submit">입양하기 💗</button></form></div></div>`}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script></body></html>
