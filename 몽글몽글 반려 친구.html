<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몽글몽글 반려 친구</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff6ea;--pink:#ffc8dc;--lav:#d9ccff;--sky:#c6e6ff;--yel:#fff0b3;--ink:#5a4a6b;--card:rgba(255,255,255,.82);--sh:0 10px 30px rgba(170,140,200,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--cream:#2a2545;--pink:#5b3b63;--lav:#3d3568;--sky:#2f4468;--yel:#5a5030;--ink:#f3eaff;--card:rgba(52,44,88,.85);--sh:0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--cream),var(--pink) 55%,var(--lav));background-attachment:fixed}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bg i{position:absolute;font-style:normal;opacity:.7;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{transform:translateY(-10px) scale(1.2);opacity:.25}}
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:14px 14px 90px}
button{font:inherit;color:inherit;cursor:pointer;border:0;transition:transform .15s,box-shadow .2s,background .2s}
button:hover{transform:translateY(-2px)}button:active{transform:scale(.93)}
button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:28px;box-shadow:var(--sh);padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.top h1{font-size:20px;margin:0;font-weight:400}
.pill{background:var(--yel);color:#6b5200;border-radius:99px;padding:5px 14px;box-shadow:var(--sh)}
.main{display:grid;gap:14px}
@media(min-width:860px){.main{grid-template-columns:1.1fr 1fr;align-items:start}#nav{position:static!important;transform:none!important;margin-bottom:12px}}
.room{position:relative;height:340px;border-radius:30px;overflow:hidden;box-shadow:var(--sh);border:5px solid #fff}
.floor{position:absolute;left:0;right:0;bottom:0;height:34%}
.win{position:absolute;left:50%;top:22px;width:110px;height:90px;margin-left:-55px;border-radius:50px 50px 14px 14px;border:5px solid #fff;overflow:hidden;cursor:pointer;z-index:1}
.win b{position:absolute;font-weight:400;animation:fall 2s linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(100px)}}
.furn{position:absolute;font-size:44px;z-index:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.12))}
.speech{position:absolute;top:10px;left:12px;right:12px;z-index:5;text-align:center}
.speech span{display:inline-block;background:#fff;color:#5a4a6b;border-radius:20px;padding:6px 14px;font-size:14px;box-shadow:var(--sh);animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.pet{position:absolute;left:50%;bottom:4%;width:230px;margin-left:-115px;z-index:3;cursor:pointer}
.pet svg{width:100%;overflow:visible}
.a-idle{animation:hop 1.8s ease-in-out infinite}.a-happy{animation:hop .7s ease-in-out infinite}
.a-sleepy{animation:sway 3s ease-in-out infinite}.a-eat{animation:chew .35s infinite}.a-sulky{animation:sway 5s infinite}.a-hungry{animation:shake .8s infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:scale(1.06,.92)}50%{transform:translateY(-22px) scale(.97,1.04)}80%{transform:scale(1.05,.94)}}
@keyframes sway{50%{transform:rotate(4deg) translateY(4px)}}
@keyframes chew{50%{transform:scale(1.04,.95)}}
@keyframes shake{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.blink{animation:bl 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bl{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px}
.bar{font-size:13px}.bar div{height:12px;background:rgba(150,120,190,.18);border-radius:9px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{flex:1;min-width:76px;padding:12px 8px;border-radius:20px;background:#fff;color:#5a4a6b;box-shadow:var(--sh);font-size:15px}
.btn:hover{background:var(--yel)}.btn.p{background:linear-gradient(135deg,#ff9ec4,#b9a3ff);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
#nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:99px;z-index:20;background:var(--card);box-shadow:var(--sh);backdrop-filter:blur(10px)}
#nav button{background:none;padding:9px 16px;border-radius:99px;font-size:15px}
#nav button[aria-selected=true]{background:linear-gradient(135deg,#ff9ec4,#b9a3ff);color:#fff}
.chat{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.m{max-width:82%;padding:9px 14px;border-radius:20px;font-size:14px;line-height:1.5;animation:pop .25s}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#ff9ec4,#b9a3ff);color:#fff;border-bottom-right-radius:6px}
.m.pt{align-self:flex-start;background:#fff;color:#5a4a6b;border-bottom-left-radius:6px}
input{font:inherit;flex:1;min-width:0;padding:12px 16px;border-radius:99px;border:2px solid var(--lav);background:#fff;color:#5a4a6b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.it{padding:10px 4px;border-radius:20px;background:#fff;color:#5a4a6b;font-size:12px;box-shadow:var(--sh)}
.it span{display:block;font-size:30px}.it.on{background:var(--yel)}.it.lk{opacity:.55}
h2{font-size:16px;margin:14px 0 8px;font-weight:400}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:var(--sh)}
.dot.on{outline:3px solid var(--ink)}
.adopt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ad{padding:12px;border-radius:26px;background:#fff;color:#5a4a6b;box-shadow:var(--sh);text-align:center}
.ad:hover{transform:translateY(-6px) rotate(-1deg)}
.ad svg{width:110px}.ad small{display:block;opacity:.7;font-size:12px}
.gm{position:relative;height:240px;border-radius:24px;background:linear-gradient(#bfe3ff,#e6d9ff);overflow:hidden;margin-top:8px}
.gm button{position:absolute;font-size:34px;background:none;animation:pop .2s}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;color:#5a4a6b;padding:10px 18px;border-radius:99px;box-shadow:var(--sh);z-index:50;animation:pop .3s}
.cele{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.cele i{position:absolute;bottom:-40px;font-style:normal;font-size:28px;animation:up 3s ease-in forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg)}}
.bd{display:inline-block;margin:3px;padding:5px 12px;border-radius:99px;background:#fff;font-size:13px;color:#5a4a6b}.bd.off{opacity:.4;filter:grayscale(1)}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ew 3.4s ease-in-out infinite}.tail{transform-box:fill-box;transform-origin:0 50%;animation:tw2 1.6s ease-in-out infinite}@keyframes ew{0%,88%,100%{transform:rotate(0)}93%{transform:rotate(-7deg)}}@keyframes tw2{50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div id="bg"></div><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script>
/* ===== 대화 모듈 (Brain) =====
 외부 AI 미연결: 성격별 규칙 기반 대화입니다.
 AI를 붙이려면 Brain.reply를 async로 바꿔 "본인 서버(프록시)"를 fetch하세요. API 키는 서버에만 두세요. */
const TITLES=['손님','주인','우리 주인','소중한 우리 주인','내 영혼의 단짝'];
const LINES={
rabbit:{hi:'{u}! 깡총깡총 왔구나 🐰',comfort:'으아아 🥺 {u} 오늘 고생했구나... 이리 와, 내가 꼭 안아 줄게! 💗',food:'당근 먹었지! 아삭아삭 🥕 너는?',love:'나도 나도! 귀가 쫑긋 올라갔어 💗',play:'깡총! 술래잡기 하자 🐰',hug:'폭신~ 안아 줄게 🫂',day:'오늘 있었던 일 다 들려줘! 귀 쫑긋 👂',rest:'같이 낮잠 자자, 새근새근 💤',def:'응응! 더 말해줘, 귀 쫑긋 👂'},
cat:{hi:'흥, 왔어? …반가운 건 아니야 😼',comfort:'…누가 {u}를 힘들게 했어? 뭐, 내 옆에 있어도 돼. 골골골 🐾',food:'참치. 너한테는 안 알려줄 거지만 😼',love:'…나도. 한 번만 말할 거야 💗',play:'흥, 딱 5분만이야. 장난감 가져와 🐾',hug:'…특별히 허락할게. 골골 💗',day:'흥, 궁금하진 않은데 말해 봐 😼',rest:'햇볕 아래가 명당이야. 이리 와 😽',def:'…듣고 있어. 계속해 봐 😼'},
bear:{hi:'어서 와, {u}! 보고 싶었곰 🐻',comfort:'아이고 {u}... 토닥토닥 🐻 곰이 꼭 안아 줄게, 푹 쉬어도 돼 💗',food:'꿀 먹었곰! 달콤해 🍯',love:'나도 {u}가 제일 좋아곰 💗',play:'좋아곰! 데굴데굴 굴러 보자 🐻',hug:'두 팔 크게 벌려서 꼬옥 🤗',day:'천천히 얘기해 줘곰. 다 들어줄게 🍯',rest:'같이 느긋하게 쉬자곰 💤',def:'그렇구나곰. 계속 말해 줘 🐻'},
chick:{hi:'삐약! {u}다아! 🐣',comfort:'삐약… 🥺 {u} 힘들었어? 내가 폭 안아 줄게! 삐약삐약 달래 줄게 💗',food:'나는 벌레… 아니 곡식! 삐약! 너는 뭐 먹었어?? 🌾',love:'삐약! 나는 더더더 사랑해!! 💗',play:'삐약! 놀자놀자! 저건 뭐야? 이건 뭐야? 🐣',hug:'폭~ 안겼다 삐약 💛',day:'뭔데뭔데?! 궁금해 삐약!',rest:'삐약… 같이 쉴래 💤',def:'삐약? 그래서 그래서? 🐣'},
blob:{hi:'말랑~ {u}! 오늘 구름이 너한테 인사했어 ☁️',comfort:'말랑… 🥺 {u}의 걱정을 내가 꿀꺽했어. 별빛 맛이야. 이리 와 폭신 💗',food:'어제 달 조각을 먹었어. 레모네이드 맛 🌙',love:'우주가 말랑해졌어. 나도야 💗',play:'말랑 춤추자! 지구 몰래 ☁️',hug:'몽글몽글~ 둥실 안아 줄게 ☁️',day:'그 얘기, 별들한테도 알려줘도 돼? ✨',rest:'같이 구름처럼 떠 있자 ☁️',def:'말랑? 그건 신비한 일이야 ✨'}};
const RULES=[[/힘들|슬프|우울|속상|지쳐|짜증/,'comfort'],[/먹|배고|밥|간식/,'food'],[/사랑|좋아/,'love'],[/놀자|놀아|게임/,'play'],[/안아|안겨/,'hug'],[/오늘|있었던|일상|학교|회사/,'day'],[/쉬|졸려|피곤|자자/,'rest'],[/안녕|하이|반가/,'hi']];
const Brain={reply(sp,text,lv,name){
 const k=(RULES.find(r=>r[0].test(text))||[0,'def'])[1];
 let t=LINES[sp][k].replace('{u}',TITLES[lv-1]);
 if(lv>=4&&k!=='def'&&k!=='hi')t+=' (우리 사이는 특별하니까, 언제든 와도 돼 ✨)';
 if(lv>=5)t+=' 영원히 네 편이야.';
 return t;}};

/* ===== 데이터 ===== */
const SP={rabbit:{n:'토끼',c:'#fff',cc:'#ffe3ee',p:'호기심 많고 다정해요'},cat:{n:'고양이',c:'#ffd9a8',cc:'#ffc27a',p:'도도하지만 은근 애정 많아요'},bear:{n:'곰',c:'#d9b08c',cc:'#c4906a',p:'느긋하고 포근해요'},chick:{n:'병아리',c:'#fff1a0',cc:'#ffe066',p:'호기심 대장, 애교쟁이예요'},blob:{n:'말랑이',c:'#d9ccff',cc:'#bfa8ff',p:'엉뚱하고 신비로워요'}};
const WEAR=[['ribbon','리본','🎀',0,1],['hat','밀짚모자','👒',20,1],['glass','별안경','⭐',30,2],['scarf','목도리','🧣',25,2],['crown','왕관','👑',40,3]];
const FURN=[['bed','침대','🛏️',30,1,'left:6%;bottom:30%'],['cush','쿠션','🛋️',20,1,'right:4%;bottom:26%'],['desk','책상','📚',25,2,'right:6%;top:30%'],['plant','화분','🪴',15,1,'left:4%;top:34%'],['toy','장난감','🧸',15,1,'left:27%;bottom:8%']];
const WALLS=['#ffe3ee','#e3f0ff','#fff4cc','#e8e0ff','#dff5e8'],FLOORS=['#ffd0a8','#d7c2ff','#bfe3c8','#ffc6d9'];
const LV=[0,25,70,140,250],LVN=['처음 만난 사이','조금 친해짐','단짝 친구','가장 소중한 친구','영혼의 단짝'];
const BADGES=[['첫 식사','🍙',s=>s.st.feed>=1],['쓰다듬기 달인','🫶',s=>s.st.pet>=10],['수다쟁이','💬',s=>s.st.chat>=10],['별 사냥꾼','🌟',s=>s.st.game>=1],['단짝','💞',s=>lvOf(s.bond)>=3],['수집가','🎁',s=>s.own.length>=5]];
const lvOf=b=>LV.filter(x=>b>=x).length;
const day=()=>new Date().toDateString();
const KEY='mongmong-v2';
const cl=v=>Math.max(0,Math.min(100,v));

/* ===== 캐릭터 SVG ===== */
const html=htm.bind(React.createElement);
const PAL={rabbit:{c:'#fff8fb',cc:'#f0b3ca',bl:'#ffe0ec'},cat:{c:'#ffcf94',cc:'#e69550',bl:'#fff0dc'},bear:{c:'#dcab7e',cc:'#b9804f',bl:'#f7dec4'},chick:{c:'#ffe66d',cc:'#f2b92f',bl:'#fff6b0'},blob:{c:'#cfc0ff',cc:'#9d88ea',bl:'#ebe4ff'}};
function Pet({sp,mood,worn}){
 const {c,cc,bl}=PAL[sp],ink='#4a3350',b=sp==='blob',ch=sp==='chick',bear=sp==='bear';
 const st={fill:c,stroke:cc,strokeWidth:3.5,strokeLinejoin:'round'};
 const fy=b?12:0,hy=b?14:ch?3:0;
 const behind={
  rabbit:html`<g><g className="ear"><ellipse cx="66" cy="40" rx="15" ry="38" transform="rotate(-8 66 70)" ...${st}/><ellipse cx="66" cy="42" rx="7.5" ry="26" transform="rotate(-8 66 70)" fill="#ffb3cd"/></g><g className="ear" style=${{animationDelay:'-1.4s'}}><ellipse cx="136" cy="44" rx="15" ry="34" transform="rotate(20 136 74)" ...${st}/><ellipse cx="136" cy="46" rx="7.5" ry="23" transform="rotate(20 136 74)" fill="#ffb3cd"/></g><circle cx="150" cy="184" r="15" fill="#fff" stroke=${cc} strokeWidth="3.5" className="tail"/></g>`,
  cat:html`<g><path className="tail" d="M138 180 Q192 184 186 132 Q184 114 170 120" fill="none" stroke=${cc} strokeWidth="17" strokeLinecap="round"/><path d="M138 180 Q192 184 186 132 Q184 114 170 120" fill="none" stroke=${c} strokeWidth="10" strokeLinecap="round"/>${[0,1].map(i=>html`<g key=${i} className="ear" transform=${i?'translate(200 0) scale(-1 1)':''}><path d="M36 92 Q28 30 62 34 Q88 42 96 66Z" ...${st}/><path d="M47 80 Q44 50 60 50 Q74 56 82 68Z" fill="#ffb3cd"/></g>`)}</g>`,
  bear:html`<g>${[0,1].map(i=>html`<g key=${i} transform=${i?'translate(200 0) scale(-1 1)':''}><circle cx="52" cy="62" r="22" ...${st}/><circle cx="52" cy="64" r="11" fill=${bl}/></g>`)}</g>`,
  chick:null,
  blob:html`<g><path d="M100 70 L100 40" stroke=${cc} strokeWidth="4" strokeLinecap="round"/><path className="ear" d="M100 20 l4 9 10 1 -8 7 3 10 -9 -6 -9 6 3 -10 -8 -7 10 -1z" fill="#fff0a0" stroke="#f2c94c" strokeWidth="3" strokeLinejoin="round"/></g>`}[sp];
 const eye=x=>{
  if(mood==='sleepy')return html`<path d=${`M${x-11} 114 Q${x} 124 ${x+11} 114`} fill="none" stroke=${ink} strokeWidth="4.5" strokeLinecap="round"/>`;
  if(mood==='eat')return html`<path d=${`M${x-11} 118 Q${x} 102 ${x+11} 118`} fill="none" stroke=${ink} strokeWidth="4.5" strokeLinecap="round"/>`;
  if(mood==='love')return html`<path d=${`M${x} 121 C${x-17} 109 ${x-8} 98 ${x} 107 C${x+8} 98 ${x+17} 109 ${x} 121Z`} fill="#ff6f9c"/>`;
  const sul=mood==='sulky';
  return html`<g><g className="blink"><ellipse cx=${x} cy=${sul?116:112} rx="11" ry=${sul?9:13.5} fill=${ink}/><circle cx=${x-3.5} cy=${sul?113:106} r=${sul?3.2:4.6} fill="#fff"/>${!sul&&html`<circle cx=${x+4} cy="118" r="2.2" fill="#fff"/>`}${mood==='hungry'&&html`<ellipse cx=${x} cy="122" rx="7" ry="2.6" fill="#bfe6ff" opacity=".85"/>`}</g>${mood==='happy'&&html`<path d=${`M${x+8} 94 l1.8 4.5 4.5 1.8 -4.5 1.8 -1.8 4.5 -1.8 -4.5 -4.5 -1.8 4.5 -1.8z`} fill="#fff6a0"/>`}${sul&&html`<path d=${x<100?`M${x-12} 100 L${x+9} 107`:`M${x+12} 100 L${x-9} 107`} stroke=${ink} strokeWidth="3.5" strokeLinecap="round"/>`}</g>`;};
 const op=['hungry','sleepy','eat'].includes(mood),big=mood==='happy'||mood==='love';
 const M=mood==='sulky'?html`<path d="M92 134 Q96 128 100 134 Q104 128 108 134" fill="none" stroke=${ink} strokeWidth="3.5" strokeLinecap="round"/>`
  :big?html`<path d="M90 126 Q100 146 110 126Z" fill="#ff7a9c" stroke=${ink} strokeWidth="3" strokeLinejoin="round"/>`
  :op?html`<ellipse cx="100" cy="133" rx=${mood==='eat'?9:6} ry=${mood==='eat'?7:8} fill="#ff7a9c" stroke=${ink} strokeWidth="3"/>`
  :html`<path d="M91 127 Q95.5 135 100 127 Q104.5 135 109 127" fill="none" stroke=${ink} strokeWidth="3.5" strokeLinecap="round"/>`;
 const face=html`<g transform=${`translate(0 ${fy})`}>
  <ellipse cx="46" cy="128" rx="14" ry="9" fill="#ff9db9" opacity=${mood==='sulky'?.8:.55}/><ellipse cx="154" cy="128" rx="14" ry="9" fill="#ff9db9" opacity=${mood==='sulky'?.8:.55}/>
  ${eye(68)}${eye(132)}
